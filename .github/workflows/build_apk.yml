name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Complete App & Build
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.mesh.offlineapp app
          cp -r app/android ../
          cd ..
          rm -rf temp_app
          
          # Android SDK version ကို 21 သို့ တိုးမြှင့်ခြင်း
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-mesh-app-release
          path: build/app/outputs/flutter-apk/app-release.apk


