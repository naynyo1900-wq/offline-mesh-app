name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Complete App & Patch SDK
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.mesh.offlineapp app
          cp -r app/android ../
          cd ..
          rm -rf temp_app

          # minSdkVersion ကို 23 သို့ တိုးမြှင့်ခြင်း
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle || true
          sed -i 's/defaultConfig {/defaultConfig {\n        minSdkVersion 23/g' android/app/build.gradle || true

          # Bluetooth, Record & Mesh Permissions များ ထည့်သွင်းခြင်း
          PERMS="<uses-permission android:name=\"android.permission.RECORD_AUDIO\" \/><uses-permission android:name=\"android.permission.BLUETOOTH\" \/><uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" \/><uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" \/><uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" \/><uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" \/><uses-permission android:name=\"android.permission.BLUETOOTH_ADVERTISE\" \/><uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" \/><uses-permission android:name=\"android.permission.NEARBY_WIFI_DEVICES\" \/>"
          sed -i "s/<manifest xmlns:android=\"http:\/\/schemas.android.com\/apk\/res\/android\">/<manifest xmlns:android=\"http:\/\/schemas.android.com\/apk\/res\/android\">$PERMS/g" android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-mesh-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
